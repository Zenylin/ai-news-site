name: Daily AI News Digest Generator

on:
  schedule:
    # 每日 UTC 00:00 (台灣時間早上 08:00) 自動執行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上點擊按鈕手動觸發

# 防止多個工作流程同時執行導致推送衝突
concurrency:
  group: daily-digest-group
  cancel-in-progress: true

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予 Auto-commit 寫入 Git 儲存庫的權限

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整抓取 Git 歷史紀錄，確保 rebase 能順利運作

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install feedparser

      - name: Run Fetch News Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python fetch_news.py

      - name: Auto Commit and Push New Digest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily AI news digest [skip ci]"
          file_pattern: "src/assets/data/*.json"
