name: Daily AI News Digest Generator

on:
  schedule:
    # 每日 UTC 00:00 (台灣時間早上 08:00) 自動執行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上點擊按鈕手動觸發

# 防止多個工作流程同時執行導致推送衝突
concurrency:
  group: daily-digest-group
  cancel-in-progress: true

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整抓取 Git 歷史紀錄，確保 rebase 能順利運作

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install feedparser

      - name: Run Fetch News Script
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python fetch_news.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/data/

          if git diff --staged --quiet; then
            echo "沒有新產出的 JSON 資料，跳過 commit。"
          else
            git commit -m "chore: auto-update daily AI news digest [skip ci]"
            # 先抓取遠端最新 commit 並 rebase，再 push
            git pull --rebase origin main
            git push origin main
          fi
