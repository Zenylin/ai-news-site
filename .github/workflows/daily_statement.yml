name: Monthly Credit Card Statement Digest

on:
  schedule:
    # 每天台灣時間中午 12:00 執行 (台新對帳單通常是月中寄發，每天掃描一次確保不漏接)
    - cron: '0 4 * * *'
  workflow_dispatch: # 支援手動觸發測試

jobs:
  run-statement-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Fetch Statement Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # 🟢 記得在 GitHub Secrets 補上這三個新變數！
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TAISHIN_PDF_PASSWORD: ${{ secrets.TAISHIN_PDF_PASSWORD }}
        run: python fetch_statement.py